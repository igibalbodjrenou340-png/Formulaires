<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section class="bas">
        <div class="icons">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="bas2">
            <span class="settings">Settings</span>
            <hr>
            <form>
                <div class="div-parent">
                    <div class="div1">
                        <span class="div5">Account</span>
                    </div>
                    <div class="div bloc2">
                        <div class="div-enfant">
                            <label for="text">Full Name</label>
                            <input type="text" id="Full Name" name="Full Name">
                        </div>
                        <div class="div-enfant">
                            <label for="text">Email Adress</label>
                            <input type="text" id="Email Adress" name="Email Adresss">
                        </div>
                        <div class="div2">
                            <label for="Number">Phone number</label>
                            <input type="Number" id="Phone Number" name="Phone Number" class="input">
                        </div>
                    </div>
                </div>
                <hr>
                <div class="div-parent">
                    <div class="div1">
                        <span class="div5">Billings</span>
                    </div>
                    <div class="div-enfant2 bloc2">
                        <div class="div-enfant div-plan">
                            <label for="text">Plan</label>
                            <input type="text" id="Plan" name="Plan">
                        </div>
                        <div class="div-enfant div-province">
                            <label for="text">Billing Interview</label>
                            <select name="" id="">
                                <option value="">Jour</option>
                                <option value="">Mois</option>
                                <option value="">Année</option>
                            </select>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="div-parent">
                    <div class="div1">
                        <span class="div5">Business Adress</span>
                    </div>
                    <div class="div bloc2">
                        <div class="div-enfant">
                            <label for="text">Street Adress</label>
                            <input type="text" id="Street Adress" name="Street Adress">
                        </div>
                        <div class="div-enfant1">
                            <div class="div-enfant div-plan">
                                <label for="text">City</label>
                                <input type="text" id="City" name="City">
                            </div>
                            <div class="div-enfant div-province">
                                <label for="text">Province</label>
                                <select name="" id="">
                                    <option value="">Newv York</option>
                                    <option value="">Los angelers</option>
                                    <option value="">California</option>
                                </select>
                            </div>
                        </div>
                        <div class="div-enfant1">
                            <div class="div-enfant div-plan">
                                <label for="text">ZIP/Postal/Code</label>
                                <input type="text" id="ZIP/Postal/Code" name="ZIP/Postal/Code">
                            </div>
                            <div class="div-enfant div-province">
                                <label for="text">Country</label>
                                <select name="" id="">
                                    <option value="">USA</option>
                                    <option value="">CANADA</option>
                                    <option value="">MEXIQUE</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="div-parent">
                    <div class="div1">
                        <span class="div5">Confirm Password</span>
                    </div>
                    <div class="div-enfant1  bloc2">
                        <div class="div-enfant div-plan">
                            <label for="Password">Password</label>
                            <input type="password" id="Password" name="Password">
                        </div>
                        <div class="div-enfant div-province">
                            <label for="Password">Confirm Password</label>
                            <input type="password" id="Confirm Password" name="Confirm Password">
                        </div>
                    </div>
                </div>
                <div class="bouton">
                    <input type="reset" value="CANCEL" class="cancel">
                    <input type="submit" value="UPDATE" class="update">
                </div>
            </form>
        </div>
    </section>
</body>
</html>
